<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конструктор лиц PEAK</title>
<style>
:root{--bg:#f3efe7;--panel:#fffdf8;--ink:#2a2622;--mut:#7b736a;--line:#e2dacd;--acc:#d9772b}
@media (prefers-color-scheme:dark){:root{--bg:#1d1b19;--panel:#272421;--ink:#f1ece4;--mut:#a39a8f;--line:#3a3530;--acc:#f0954a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:minmax(280px,520px) 1fr;gap:20px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 14px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:12px;align-self:start}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:10px;cursor:grab;touch-action:none;
background:repeating-conic-gradient(#0000 0 25%,#8881 0 50%) 0 0/24px 24px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.it{border:2px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;text-align:center;font-size:11px;color:var(--mut);background:#d6a07633}
.it img{width:100%;aspect-ratio:1;display:block}.it.on{border-color:var(--acc);color:var(--ink);font-weight:600}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw span{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.sw span.on{outline:3px solid var(--acc)}
input[type=color]{width:40px;height:34px;border:none;background:none;padding:0}
.sl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;align-items:center}
.sl input{width:100%;accent-color:var(--acc)}
label.ck{display:flex;gap:8px;align-items:center;margin-top:6px}
.hint{color:var(--mut);font-size:12px;margin-top:8px}
</style></head><body>
<div class="wrap">
<div class="stage"><h1>Конструктор лиц PEAK</h1><p class="sub">Глаза и рты из игры. Перетаскивай глаза и рот прямо на лице.</p>
<canvas id="cv" width="1024" height="1024"></canvas>

<div class="sec"><h2>Глаза</h2><div class="grid" id="eg"></div></div>
<div class="sec"><h2>Рот</h2><div class="grid" id="mg"></div>
<label class="ck"><input type="checkbox" id="nomouth"> Без рта</label></div>
<div class="sec"><h2>Положение</h2><div class="sl" id="sliders"></div>
<label class="ck"><input type="checkbox" id="blush"> Румянец</label>
<label class="ck"><input type="checkbox" id="brow"> Бровь призрака</label></div>

const cv=document.getElementById('cv'),c=cv.getContext('2d'),S=1024;
const load=s=>{const i=new Image();i.src=s;i.onload=draw;return i};
D.eyes.forEach(e=>e.img=load(e.src));D.mouths.forEach(m=>m.img=load(m.src));
const brow=load(D.extra.brow);
const TONES=['#fad6b4','#f0be96','#d6a076','#aa7350','#6e4632','#fad25a','#8cc8f0','#96d282','#e88a8a','#b9a0e6'];
const DEF={color:'#d6a076',eye:'Eyes_basic',mouth:'Mouth_Smiley',es:.26,sp:.30,ey:.42,ex:0,tilt:0,ms:.34,my:.66,mx:0};
let st=Object.assign({},DEF);
const SL=[['es','Размер глаз',.1,.45],['sp','Расстояние',.05,.6],['tilt','Наклон глаз',-30,30],['ms','Размер рта',.1,.6]];
const sw=document.getElementById('sw');
function buildSw(){sw.innerHTML='';TONES.forEach(t=>{const s=document.createElement('span');s.style.background=t;if(t==st.color)s.className='on';s.onclick=()=>{st.color=t;pick.value=t;buildSw();draw()};sw.append(s)});sw.append(pick)}
const pick=document.createElement('input');pick.type='color';pick.value=st.color;pick.oninput=()=>{st.color=pick.value;buildSw();draw()};
function grid(id,list,key){const g=document.getElementById(id);g.innerHTML='';list.forEach(x=>{const d=document.createElement('div');d.className='it'+(st[key]==x.id?' on':'');d.innerHTML=`<img src="${x.src}"><div>${x.n}</div>`;d.onclick=()=>{st[key]=x.id;if(key=='mouth')nm.checked=false;grid(id,list,key);draw()};g.append(d)})}
const sl=document.getElementById('sliders');
function buildSl(){sl.innerHTML='';SL.forEach(([k,n,a,b])=>{const l=document.createElement('div');l.textContent=n;const i=document.createElement('input');i.type='range';i.min=a;i.max=b;i.step=(b-a)/200;i.value=st[k];i.oninput=()=>{st[k]=+i.value;draw()};sl.append(l,i)})}
const nm=document.getElementById('nomouth'),bl=document.getElementById('blush'),bw=document.getElementById('brow'),ol=document.getElementById('outl');
[nm,bl,bw,ol].forEach(x=>x.onchange=draw);
function eyeImg(){return D.eyes.find(e=>e.id==st.eye).img}
function draw(){
 c.clearRect(0,0,S,S);const cx=S/2,R=S*.46;
 c.beginPath();c.arc(cx,cx,R,0,7);c.fillStyle=st.color;c.fill();
 if(ol.checked){c.lineWidth=S*.012;c.strokeStyle='#1e1919';c.stroke()}
 c.save();c.beginPath();c.arc(cx,cx,R-1,0,7);c.clip();
 if(bl.checked){c.fillStyle='rgba(240,90,110,.45)';[-1,1].forEach(s=>{c.beginPath();c.ellipse(cx+s*S*.25+st.ex*S,S*(st.ey+.14),S*.08,S*.05,0,0,7);c.fill()})}
 const e=eyeImg(),w=st.es*S;
 [-1,1].forEach(s=>{c.save();c.translate(cx+st.ex*S+s*st.sp*S/2,st.ey*S);c.scale(s,1);c.rotate(st.tilt*Math.PI/180);c.drawImage(e,-w/2,-w/2,w,w);c.restore()});
 if(bw.checked){const bwid=st.sp*S*1.2;c.drawImage(brow,cx+st.ex*S-bwid/2,st.ey*S-w*.75,bwid,bwid)}
 if(!nm.checked){const m=D.mouths.find(m=>m.id==st.mouth).img,mw=st.ms*S;c.drawImage(m,cx+st.mx*S-mw/2,st.my*S-mw/2,mw,mw)}
 c.restore();
}
let drag=null;
function pos(ev){const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height]}
cv.onpointerdown=ev=>{const[x,y]=pos(ev);const de=Math.hypot(x-.5-st.ex,y-st.ey),dm=Math.hypot(x-.5-st.mx,y-st.my);
 drag={k:(nm.checked||de<dm)?'e':'m',x,y,o:{...st}};cv.setPointerCapture(ev.pointerId);cv.style.cursor='grabbing'};
cv.onpointermove=ev=>{if(!drag)return;const[x,y]=pos(ev),dx=x-drag.x,dy=y-drag.y;
 if(drag.k=='e'){st.ex=drag.o.ex+dx;st.ey=drag.o.ey+dy}else{st.mx=drag.o.mx+dx;st.my=drag.o.my+dy}draw()};
cv.onpointerup=()=>{drag=null;cv.style.cursor='grab'};
document.getElementById('dl').onclick=()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`peak_face_${st.eye}_${nm.checked?'none':st.mouth}.png`;a.click()})};
const r=a=>a[Math.floor(Math.random()*a.length)];
document.getElementById('rnd').onclick=()=>{st.eye=r(D.eyes).id;st.mouth=r(D.mouths).id;st.color=r(TONES);refresh()};
document.getElementById('rst').onclick=()=>{st=Object.assign({},DEF);[nm,bl,bw].forEach(x=>x.checked=false);refresh()};
function refresh(){pick.value=st.color;buildSw();grid('eg',D.eyes,'eye');grid('mg',D.mouths,'mouth');buildSl();draw()}
refresh();
</script></body></html>
